# ==============================================================================
# PODSTAWOWE USTAWIENIA
# ==============================================================================
set -g default-terminal "tmux-256color"
set -g mouse on

# Zmiana klawisza Prefix na Ctrl + Spacja
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Skróty w trybie kopiowania (Vi mode)
setw -g mode-keys vi

# Numeracja okien od 1 zamiast 0 i automatyczne przenumerowanie
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ==============================================================================
# KONFIGURACJA WTYCZKI: TOKYO NIGHT
# ==============================================================================
set -g @tokyo-night-tmux_theme night
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_wgb 1
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_battery_widget 1

# Ładowanie wtyczki z lokalnej ścieżki
run-shell ~/.config/tmux/plugins/tokyo-night-tmux/tokyo-night.tmux

# ==============================================================================
# WŁASNE SKRÓTY KLAWISZOWE (BINDS)
# ==============================================================================

# Otwieranie TODO w Neovim w nowym oknie
bind -n C-g new-window -n "TODO" "nvim ~/.TODO.md"

# Interaktywne tworzenie nowej sesji (Popup)
bind n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'

# Interaktywna zmiana sesji przez fzf (Popup)
bind s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# Pływający terminal pod Ctrl + q (Popup)
bind -n C-q if-shell -F '#{popup_visible}' 'display-popup -C' 'display-popup -d "#{pane_current_path}" -T "Floating Terminal"'

# Nawigacja po panelach (Ctrl + Strzałki)
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R

# Nawigacja po panelach w stylu Vim (Prefix + h/j/k/l)
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# Przełączanie okien (Alt + 1-9)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Dzielenie paneli w aktualnej ścieżce
bind -n C-'[' split-window -c "#{pane_current_path}"
bind -n C-']' split-window -h -c "#{pane_current_path}"

# Zarządzanie oknami i panelami
bind -n C-f resize-pane -Z
bind -n C-F select-layout even-horizontal
bind -n C-e detach-client
bind -n C-w kill-pane

# Przeładowanie konfiguracji
bind -n C-i source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

